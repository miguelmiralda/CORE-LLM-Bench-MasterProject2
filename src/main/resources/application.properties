# Input/Output
# FamilyOWL run (comment out when running OWL2Bench)
#processing.ontologies-directory=data/input/FamilyOWL/1hop
#processing.output-directory=data/output/FamilyOWL/1hop

# OWL2Bench run (comment out when running FamilyOWL)
processing.ontologies-directory=data/input/OWL2Bench/1hop
processing.output-directory=data/output/OWL2Bench/1hop

# TBox calculation (classes + properties)
tbox.include.classes=true
tbox.include.object.properties=true
tbox.include.data.properties=true
tbox.include.annotation.properties=false

# Processing
processing.checkpoint.frequency=50
reasoner.timeout.seconds=300

# Logging

logging.level.root=INFO
logging.level.com.example=DEBUG

# LLM evaluation
llm.api.url=https://api.openai.com/v1/chat/completions
llm.api.key=${OPENAI_API_KEY:}
llm.model=gpt-4.1-mini-2025-04-14
llm.mock.mode=false